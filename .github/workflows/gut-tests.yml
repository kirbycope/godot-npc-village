name: GUT Unit Tests

# The suite never makes a network request. RuntimeMode sees GUT's runner on the command
# line and both paid services refuse to send anything, so this needs no API keys and
# costs nothing to run on every push.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.8-dev4

jobs:
  gut:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch the addon dependencies
        shell: bash
        run: python tools/pull_addons.py

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install Blender when the project has a .blend
        shell: bash
        run: |
          set -euo pipefail
          if ! find . -name '*.blend' -not -path './.git/*' | grep -q .; then
            echo "No .blend in this repository; Godot will never reach for Blender."
            exit 0
          fi
          echo "Found a .blend; installing Blender."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender
          # Godot must be told where Blender is. Without this it fails with "Cannot
          # configure blender path in headless mode", and that error aborts the WHOLE
          # import: no fonts, no textures, and an export a tenth of its proper size. This
          # repository ships one .blend, inside the weather_fx addon, and without this
          # step the web export came out at 8.6 MB instead of 85 MB.
          settings="$HOME/.config/godot/editor_settings-${GODOT_VERSION%%-*}.tres"
          mkdir -p "$(dirname "$settings")"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo 'filesystem/import/blender/blender_path = "/usr/bin/blender"'
          } > "$settings"
          blender --version | head -1

      - name: Import the project
        shell: bash
        run: |
          set -euo pipefail
          for _ in 1 2 3; do
            godot --headless --path . --import
          done

      - name: Run the tests
        shell: bash
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
          NPC_VILLAGE_OFFLINE: "1"
        run: |
          set -euo pipefail
          mkdir -p test-results
          godot --headless --path . \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit,res://tests/integration \
            -gjunit_xml_file=test-results/gut-junit.xml \
            -gexit

      - name: Archive the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-report
          path: test-results/
          if-no-files-found: warn
